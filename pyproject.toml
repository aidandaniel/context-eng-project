[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-eng"
version = "0.1.0"
description = "Open-source MCP server: query-matched, ML-budgeted context packs that reduce LLM token usage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aidan Decker" }]
keywords = ["mcp", "llm", "context", "tokens", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "scikit-learn>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/aidandaniel/context-eng-project"
Issues = "https://github.com/aidandaniel/context-eng-project/issues"
Source = "https://github.com/aidandaniel/context-eng-project"

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
embeddings = [
    "sentence-transformers>=3.0",
]
swebench = [
    "datasets>=2.19",
    "tiktoken>=0.5",
]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "tiktoken>=0.5",
    "datasets>=2.19",
]

[tool.mypy]
python_version = "3.12"
packages = ["context_eng"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "context_eng.config",
    "context_eng.retrieval.anchor_inference",
    "context_eng.server",
]
disable_error_code = ["arg-type"]

[project.scripts]
context-eng-mcp = "context_eng.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["context_eng*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
context_eng = ["py.typed", "ml/models/*.joblib", "ml/models/checksums.json"]

[tool.pytest.ini_options]
markers = [
    "benchmark: end-to-end token-reduction benchmark gate (may be slower)",
]
testpaths = ["tests"]
pythonpath = ["src", "."]
